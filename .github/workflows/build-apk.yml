name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @capacitor/core@latest @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest

      - name: Build Web Application
        run: npm run build

      - name: Generate Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Accept Android Licenses & Build Debug APK
        working-directory: android
        run: |
          yes | sdkmanager --licenses || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modern-PDF-Viewer.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: android-apk-v1.0
          name: "Modern PDF Viewer - Android APK Download"
          body: "Direct APK download for Android phones. Install on any Android device to read, annotate and edit PDFs offline."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
