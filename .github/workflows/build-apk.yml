name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm install
          npm install --save @capacitor/core@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6.0.0 @capacitor/share@6.0.0
          npm install --save-dev @capacitor/cli@6.2.0

      - name: Build Web Application
        run: npm run build

      - name: Generate Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Modern-PDF-Viewer.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: android-apk-v1.1
          name: "Modern PDF Viewer v1.1 - Android APK Download"
          body: "Direct APK download for Android phones. Features mobile 2-finger pinch-to-zoom, double-tap zoom, dark/light theme toggle, and 100% offline PDF reading and annotations."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
